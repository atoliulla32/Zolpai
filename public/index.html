<script>
let gasData = [];
let allProducts = [];
let categoryList = [];
let cart = JSON.parse(localStorage.getItem('zolpai_cart')) || [];
let customFirebasePrices = {}; 
let pendingAction = null, pendingProduct = null, availableVariantKeys = [];

const formatPrice = (price) => new Intl.NumberFormat('en-IN').format(price);

// ★ ফায়ারবেস রিয়েল-টাইম প্রাইস চেকার (এডমিন প্যানেল থেকে ডেটা আসবে)
db.ref('custom_prices').on('value', (snapshot) => {
  customFirebasePrices = snapshot.val() || {};
  if(gasData.length > 0) processAndRenderData(); 
});

async function load(){
  updateCartUI(); 
  try{
    // গুগল স্ক্রিপ্ট থেকে ডেটা আনা
    const res = await fetch(GOOGLE_SCRIPT_URL, { method: "GET", redirect: "follow" });
    if(!res.ok) throw new Error("সার্ভার রেসপন্স করছে না!");
    const json = await res.json();
    
    if(json.result === true) {
      gasData = json.data || [];
      processAndRenderData();
      document.getElementById('loading').style.display = 'none';
    }
  }catch(e){
    document.getElementById('loading').innerHTML = '<span class="text-red-500 font-bold bg-red-50 px-4 py-2 rounded-lg">Error: '+e.message+'</span>';
  }
}

function processAndRenderData() {
  allProducts = gasData.map(p => {
    // ফায়ারবেসে যদি কাস্টম দাম থাকে, তবে সেটা নেবে, না থাকলে গুগলের ডিফল্ট দাম (defaultSalePrice) নেবে
    let finalSalePrice = customFirebasePrices[p.id] ? parseFloat(customFirebasePrices[p.id]) : parseFloat(p.defaultSalePrice);
    p.myPrice = finalSalePrice;
    
    // গুগল স্ক্রিপ্ট থেকে আসা oldPrice ব্যবহার করা হচ্ছে (আসল দামের ২ গুন)
    p.discountPercent = Math.round(((p.oldPrice - finalSalePrice) / p.oldPrice) * 100);
    return p;
  });
  
  extractCategories();
  
  // চেক করা হচ্ছে কোন পেজে আছে
  const currentQ = document.getElementById('searchBox').value.toLowerCase();
  if(currentQ) {
    renderProducts(allProducts.filter(p => p.name.toLowerCase().includes(currentQ) || p.category_name.toLowerCase().includes(currentQ)));
  } else if (!document.getElementById('productView').classList.contains('hidden')) {
    const catTitle = document.getElementById('currentCategoryTitle').innerText;
    renderProducts(allProducts.filter(p => p.category_name === catTitle));
  } else {
    showCategories(); 
  }
}

function extractCategories() {
  const catMap = new Map();
  allProducts.forEach(p => { if(!catMap.has(p.category_name)) catMap.set(p.category_name, p.thumbnail_image || 'https://via.placeholder.com/300'); });
  categoryList = Array.from(catMap, ([name, image]) => ({ name, image }));
}

function showCategories() {
  document.getElementById('productView').classList.add('hidden'); 
  document.getElementById('categoryView').classList.remove('hidden'); 
  document.getElementById('searchBox').value = '';
  
  const grid = document.getElementById('categoryGrid');
  grid.innerHTML = categoryList.map(cat => `
    <div onclick="showCategoryProducts('${cat.name.replace(/'/g, "\\'")}')" class="bg-white rounded-2xl shadow-sm hover:shadow-lg transition-all cursor-pointer overflow-hidden border border-gray-100 flex flex-col items-center p-5 text-center group">
      <div class="w-24 h-24 mb-4 rounded-full overflow-hidden bg-green-50 border-[3px] border-green-100 group-hover:scale-110 transition-transform duration-300">
        <img src="${cat.image}" class="w-full h-full object-cover">
      </div>
      <h3 class="font-bold text-gray-800 text-sm md:text-base">${cat.name}</h3>
    </div>
  `).join('');
}

function showCategoryProducts(categoryName) {
  document.getElementById('categoryView').classList.add('hidden'); 
  document.getElementById('productView').classList.remove('hidden'); 
  document.getElementById('currentCategoryTitle').innerText = categoryName;
  renderProducts(allProducts.filter(p => p.category_name === categoryName));
}

function renderProducts(products) {
  const grid = document.getElementById('productGrid');
  if(products.length === 0) return grid.innerHTML = '<div class="col-span-full text-center py-10 text-gray-500 font-bold bg-white rounded-xl shadow-sm border border-gray-100">কোনো পণ্য পাওয়া যায়নি</div>';
  
  grid.innerHTML = products.map(p => `
    <div class="bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-100 overflow-hidden flex flex-col cursor-pointer group" onclick="openQuickView(${p.id})">
      <div class="relative overflow-hidden bg-gray-50 aspect-square flex items-center justify-center">
        <img src="${p.thumbnail_image || 'https://via.placeholder.com/300'}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
        <span class="absolute top-2 left-2 text-[10px] bg-red-500 text-white px-2 py-0.5 rounded-full font-bold shadow-sm">-${p.discountPercent}%</span>
        <span class="absolute top-2 right-2 text-[10px] bg-gray-800 text-white px-2 py-0.5 rounded font-bold shadow-sm">কোড: ${p.id}</span>
        <div class="absolute bottom-2 left-1/2 transform -translate-x-1/2 bg-white/95 backdrop-blur shadow-md border border-gray-200 text-gray-700 px-3 py-1 rounded-full text-[10px] font-bold flex items-center gap-1 opacity-90 group-hover:opacity-100 group-hover:-translate-y-1 transition-all">👀 বিস্তারিত দেখুন</div>
      </div>
      <div class="p-3 md:p-4 flex flex-col flex-1">
        <h3 class="font-bold text-gray-700 text-xs md:text-sm h-9 md:h-10 line-clamp-2 leading-tight mb-2 group-hover:text-green-600 transition-colors">${p.name}</h3>
        <div class="flex items-center gap-2 mb-3 mt-auto">
          <p class="font-black text-base md:text-lg text-green-600 leading-none">৳${formatPrice(p.myPrice)}</p>
          <p class="text-[10px] md:text-xs line-through text-gray-400">৳${formatPrice(p.oldPrice)}</p>
        </div>
        <div class="flex flex-col gap-2 relative z-10" onclick="event.stopPropagation()">
          <button onclick="handleAction(${p.id}, 'cart')" class="w-full border-2 border-green-500 text-green-600 hover:bg-green-50 active:scale-95 py-1.5 rounded-xl text-xs font-bold transition-all">🛒 কার্টে যোগ করুন</button>
          <button onclick="handleAction(${p.id}, 'buy')" class="w-full bg-orange-500 hover:bg-orange-600 active:scale-95 text-white py-1.5 rounded-xl text-xs font-bold transition-all shadow-sm">⚡ অর্ডার করুন</button>
        </div>
      </div>
    </div>`).join('');
}

document.getElementById('searchBox').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  if(!q) return showCategories();
  document.getElementById('categoryView').classList.add('hidden'); 
  document.getElementById('productView').classList.remove('hidden'); 
  document.getElementById('currentCategoryTitle').innerText = 'সার্চ রেজাল্ট';
  renderProducts(allProducts.filter(p => p.name.toLowerCase().includes(q) || p.category_name.toLowerCase().includes(q)));
});

function openQuickView(id) {
  const p = allProducts.find(item => item.id === id); if(!p) return;
  
  document.getElementById('qvTitle').innerText = p.name; 
  document.getElementById('qvImage').src = p.thumbnail_image; 
  document.getElementById('qvCode').innerText = `কোড: ${p.id}`;
  document.getElementById('qvPrice').innerText = `৳${formatPrice(p.myPrice)}`; 
  document.getElementById('qvOldPrice').innerText = `৳${formatPrice(p.oldPrice)}`;
  document.getElementById('qvDiscountBadge').innerText = `সেভ ৳${formatPrice(p.oldPrice - p.myPrice)}`; 
  document.getElementById('qvDesc').innerHTML = p.description || '<p>কোনো বিবরণ নেই।</p>';
  
  document.getElementById('qvActions').innerHTML = `
    <button onclick="handleAction(${p.id}, 'cart'); closeQuickView();" class="flex-1 border-2 border-green-500 text-green-600 bg-green-50 hover:bg-green-100 font-bold py-2.5 rounded-xl transition-colors text-sm">🛒 কার্টে যোগ</button>
    <button onclick="handleAction(${p.id}, 'buy'); closeQuickView();" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 rounded-xl shadow-md transition-colors text-sm">⚡ দ্রুত অর্ডার</button>
  `;

  const gallery = document.getElementById('qvGallery');
  if(p.gallery_image && p.gallery_image.length > 0) {
    let images = [p.thumbnail_image, ...p.gallery_image];
    gallery.innerHTML = images.map(img => `<img src="${img}" onclick="document.getElementById('qvImage').src='${img}'" class="w-14 h-14 object-cover rounded-lg border-2 border-transparent hover:border-green-500 cursor-pointer transition-all shrink-0 shadow-sm bg-white">`).join('');
    gallery.classList.remove('hidden');
  } else {
    gallery.classList.add('hidden');
  }

  const modal = document.getElementById('quickViewModal'); 
  const content = document.getElementById('quickViewContent');
  modal.classList.remove('hidden'); 
  modal.classList.add('flex'); 
  setTimeout(() => content.classList.replace('scale-95', 'scale-100'), 10);
}

function closeQuickView() {
  const modal = document.getElementById('quickViewModal'); 
  const content = document.getElementById('quickViewContent');
  content.classList.replace('scale-100', 'scale-95'); 
  setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300);
}

function handleAction(id, actionType) {
  const p = allProducts.find(item => item.id === id); if(!p) return;
  if(p.product_type === 'variant' && p.variants && p.variants.length > 0) openVariantModal(p, actionType); 
  else { if(actionType === 'cart') finalizeAddToCart(p, ''); else finalizeBuyNow(p, ''); }
}

function openVariantModal(product, actionType) {
  pendingProduct = product; pendingAction = actionType; const optionsMap = {};
  product.variants.forEach(v => { 
    for(const key in v) { 
      if(!['qty', 'regular_price', 'price', 'sku'].includes(key)) { 
        if(!optionsMap[key]) optionsMap[key] = new Set(); 
        if(v[key]) optionsMap[key].add(v[key]); 
      } 
    } 
  });
  
  availableVariantKeys = Object.keys(optionsMap); 
  const container = document.getElementById('variantOptionsContainer'); 
  container.innerHTML = '';
  
  availableVariantKeys.forEach(key => {
    const values = Array.from(optionsMap[key]);
    if(values.length > 0) {
      let html = `<div class="mb-5"><h4 class="font-bold text-gray-700 mb-2">${key}:</h4><div class="flex flex-wrap gap-2">`;
      values.forEach((val, index) => {
        const inputId = `var_${key}_${index}`;
        html += `<div><input type="radio" name="variant_${key}" id="${inputId}" value="${val}" class="radio-btn-input hidden" ${index === 0 ? 'checked' : ''}><label for="${inputId}" class="radio-btn-label cursor-pointer px-4 py-1.5 border border-gray-300 bg-white rounded-lg text-sm font-bold text-gray-600 transition-colors block shadow-sm">${val}</label></div>`;
      });
      html += `</div></div>`; 
      container.insertAdjacentHTML('beforeend', html);
    }
  });

  const modal = document.getElementById('variantModal'); 
  const content = document.getElementById('variantContent');
  modal.classList.remove('hidden'); 
  modal.classList.add('flex'); 
  setTimeout(() => content.classList.remove('translate-y-full'), 10);
  
  document.getElementById('confirmVariantBtn').onclick = () => {
    let selectedDetails = []; let isAllSelected = true;
    availableVariantKeys.forEach(key => {
      const selected = document.querySelector(`input[name="variant_${key}"]:checked`);
      if(selected) selectedDetails.push(`${key}: ${selected.value}`); else isAllSelected = false;
    });
    if(!isAllSelected && availableVariantKeys.length > 0) return showToast("সব অপশন সিলেক্ট করুন", "error");
    const variantString = selectedDetails.length > 0 ? `(${selectedDetails.join(', ')})` : ''; 
    closeVariantModal();
    if(pendingAction === 'cart') finalizeAddToCart(pendingProduct, variantString); else finalizeBuyNow(pendingProduct, variantString);
  };
}

function closeVariantModal() {
  const modal = document.getElementById('variantModal'); 
  const content = document.getElementById('variantContent');
  content.classList.add('translate-y-full'); 
  setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300);
}

function saveCart() { 
  localStorage.setItem('zolpai_cart', JSON.stringify(cart)); 
  updateCartUI(); 
}

function finalizeAddToCart(p, variantString) {
  const cartItemId = p.id + (variantString ? '-' + variantString : ''); 
  const existing = cart.find(item => item.cartId === cartItemId);
  if(existing) existing.qty++; 
  else cart.push({ cartId: cartItemId, id: p.id, name: p.name, variantText: variantString, price: p.myPrice, image: p.thumbnail_image, qty: 1 });
  saveCart(); 
  showToast("কার্টে যোগ করা হয়েছে! 🛒", "success");
}

function updateCartQty(cartId, change) {
  const item = cart.find(i => i.cartId === cartId);
  if(item) { 
    item.qty += change; 
    if(item.qty <= 0) cart = cart.filter(i => i.cartId !== cartId); 
    saveCart(); 
  }
}

function updateCartUI() {
  const count = cart.reduce((sum, item) => sum + item.qty, 0);
  document.querySelectorAll('.cart-count').forEach(el => el.innerText = count);
  const container = document.getElementById('cartItems');
  
  if(cart.length === 0) { 
    container.innerHTML = `<div class="text-center text-gray-400 mt-10 font-bold">আপনার কার্ট খালি!</div>`; 
    document.getElementById('cartTotal').innerText = '৳0'; 
    return; 
  }
  
  let total = 0;
  container.innerHTML = cart.map(item => {
    total += item.price * item.qty;
    return `
    <div class="flex gap-3 bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
      <img src="${item.image}" class="w-16 h-16 object-cover rounded-lg bg-gray-50 border">
      <div class="flex-1 flex flex-col justify-between">
        <div>
          <h4 class="text-sm font-bold text-gray-800 line-clamp-1">${item.name}</h4>
          ${item.variantText ? `<p class="text-[10px] font-bold text-orange-500 mt-0.5">${item.variantText}</p>` : ''}
        </div>
        <div class="flex justify-between items-center mt-2">
          <span class="text-sm font-black text-green-600">৳${formatPrice(item.price)}</span>
          <div class="flex items-center border border-gray-200 rounded-lg bg-white shadow-sm">
            <button onclick="updateCartQty('${item.cartId}', -1)" class="px-3 py-1 text-gray-500 hover:text-green-600 hover:bg-green-50 rounded-l-lg font-bold">-</button>
            <span class="px-2 text-xs font-black w-6 text-center text-gray-700">${item.qty}</span>
            <button onclick="updateCartQty('${item.cartId}', 1)" class="px-3 py-1 text-gray-500 hover:text-green-600 hover:bg-green-50 rounded-r-lg font-bold">+</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('cartTotal').innerText = `৳${formatPrice(total)}`;
}

function toggleCart() {
  const modal = document.getElementById('cartModal'); 
  const content = document.getElementById('cartContent');
  if(modal.classList.contains('hidden')) { 
    modal.classList.remove('hidden'); 
    modal.classList.add('flex'); 
    setTimeout(() => content.classList.remove('translate-x-full'), 10); 
  } else { 
    content.classList.add('translate-x-full'); 
    setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300); 
  }
}

function showToast(message, type = 'success') {
  const container = document.getElementById('toastContainer'); 
  const bgColor = type === 'success' ? 'bg-gray-800' : 'bg-red-500';
  const toast = document.createElement('div');
  toast.className = `${bgColor} text-white px-6 py-3 rounded-full font-bold shadow-2xl transform transition-all duration-300 translate-y-10 opacity-0 flex items-center gap-2 text-sm border border-gray-600/50`; 
  toast.innerHTML = message;
  container.appendChild(toast); 
  setTimeout(() => { toast.classList.remove('translate-y-10', 'opacity-0'); }, 10);
  setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 2500);
}

function finalizeBuyNow(p, variantString) {
  const vText = variantString ? `\nসাইজ/কালার: ${variantString}` : '';
  const msg = `হ্যালো, আমি একটি অর্ডার করতে চাই:\n\nপণ্য: ${p.name}\nকোড: ${p.id}${vText}\nদাম: ৳${formatPrice(p.myPrice)}\nছবির লিংক: ${p.thumbnail_image}`;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
}

function checkoutWhatsApp() {
  if(cart.length === 0) return showToast('আপনার কার্ট খালি!', 'error');
  let msg = `হ্যালো, আমি নিচের পণ্যগুলো অর্ডার করতে চাই:\n\n`; 
  let total = 0;
  cart.forEach((item, i) => {
    const vText = item.variantText ? ` ${item.variantText}` : '';
    msg += `${i+1}. ${item.name} (কোড: ${item.id})${vText}\nপরিমাণ: ${item.qty} টি\nদাম: ৳${formatPrice(item.price * item.qty)}\nছবির লিংক: ${item.image}\n\n`;
    total += item.price * item.qty;
  });
  msg += `------------------\n*সর্বমোট বিল: ৳${formatPrice(total)}*`;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
}

// Start Application
load();
</script>
</body>
</html>
