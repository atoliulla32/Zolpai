<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zolpai.com</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Hind Siliguri',sans-serif}</style>
</head>
<body class="bg-gray-50">

<script>
// ★★★ এখানে আলাদা আলাদা লাভ দিন ★★★
const PROFIT_BY_ID = {
  1: 10,   
  2: 100,  
  5: 3,    
};
const DEFAULT_PROFIT = 20; // বাকি সব প্রোডাক্টে 20% লাভ

// আপনার হোয়াটসঅ্যাপ নম্বর
const WHATSAPP_NUMBER = "8801602100492"; 

// ★★★ আপনার নতুন গুগল স্ক্রিপ্ট লিংক ★★★
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxdjN7gVjmqVuaiIHngvVxwEDdfXEw__6i_OfE1Ev0V8s_JmMcwXYTIc_vK8zQ3LESO/exec";
</script>

<header class="bg-white shadow sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <h1 class="text-2xl font-black text-green-600">Zolpai<span class="text-orange-500">.com</span></h1>
    <input id="searchBox" placeholder="খুঁজুন..." class="border border-gray-300 rounded-full px-4 py-2 text-sm w-44 md:w-80 outline-none focus:border-green-500">
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6">
  <div id="loading" class="text-center py-20 text-gray-500 font-semibold">লোড হচ্ছে...</div>
  <div id="grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6"></div>
</main>

<script>
let allProducts=[];

async function load(){
  try{
    // গুগল স্ক্রিপ্ট থেকে ডেটা আসবে, তাই কোনো CORS Error হবে না
    const res = await fetch(GOOGLE_SCRIPT_URL);

    if(!res.ok) throw new Error("সার্ভার থেকে সঠিক রেসপন্স আসেনি!");

    const json = await res.json();
    
    if(json.result === true) {
      allProducts = json.data || [];
    } else {
      throw new Error(json.message || "API থেকে ডেটা আসেনি");
    }
    
    document.getElementById('loading').style.display='none';
    render(allProducts);
  }catch(e){
    document.getElementById('loading').innerHTML = '<span class="text-red-500 font-bold">Error: '+e.message+'</span>';
  }
}

function render(list){
  if(list.length === 0) {
    document.getElementById('grid').innerHTML = '<div class="col-span-full text-center text-gray-500 py-10">কোনো পণ্য পাওয়া যায়নি</div>';
    return;
  }

  document.getElementById('grid').innerHTML = list.map(p=>{
    const original = parseFloat(p.price||0);
    const percent = PROFIT_BY_ID[p.id] !== undefined ? PROFIT_BY_ID[p.id] : DEFAULT_PROFIT;
    const myPrice = Math.round(original * (1 + percent/100));
    const catName = p.category_name || 'পণ্য';
    
    const cleanName = (p.name || '').replace(/'/g, "").replace(/"/g, "");

    return `<div class="bg-white rounded-2xl shadow-sm hover:shadow-lg transition-shadow duration-300 border border-gray-100 overflow-hidden group">
      <div class="relative overflow-hidden bg-gray-100">
        <img src="${p.thumbnail_image || 'https://via.placeholder.com/300'}" class="h-48 w-full object-cover group-hover:scale-105 transition-transform duration-500">
        <span class="absolute top-2 left-2 text-[10px] bg-red-500 text-white px-2 py-0.5 rounded-full font-bold shadow">+${percent}%</span>
      </div>
      <div class="p-4">
        <p class="text-[10px] text-gray-500 mb-1">${catName}</p>
        <h3 class="font-semibold text-gray-800 text-sm h-10 line-clamp-2 leading-tight">${p.name}</h3>
        <div class="flex justify-between items-end mt-4">
          <div>
            <p class="text-xs line-through text-gray-400 mb-0.5">৳${original}</p>
            <p class="font-bold text-lg text-green-600 leading-none">৳${myPrice}</p>
          </div>
          <button onclick="orderProduct('${cleanName}', ${myPrice})" class="bg-orange-500 hover:bg-orange-600 active:scale-95 text-white px-4 py-1.5 rounded-full text-xs font-bold transition-all shadow-md">অর্ডার</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function orderProduct(productName, price) {
  const message = `হ্যালো, আমি আপনাদের সাইট থেকে একটি অর্ডার করতে চাই:\n\nপণ্য: ${productName}\nদাম: ৳${price}`;
  const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
  window.open(whatsappUrl, '_blank');
}

document.getElementById('searchBox').addEventListener('input', e=>{
  const q=e.target.value.toLowerCase();
  render(allProducts.filter(p=>p.name.toLowerCase().includes(q)));
});

load();
</script>
</body>
</html>
