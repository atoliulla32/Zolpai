<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zolpai.com</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Hind Siliguri',sans-serif}</style>
</head>
<body class="bg-gray-50">

<script>
// ★★★ এখানে আলাদা আলাদা লাভ দাও ★★★
const PROFIT_BY_ID = {
  1: 10,   // ID 1 এ 10%
  2: 100,  // ID 2 এ 100%
  5: 3,    // ID 5 এ 3%
};
const DEFAULT_PROFIT = 20; // বাকি সব প্রোডাক্টে 20%
</script>

<header class="bg-white shadow sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <h1 class="text-2xl font-black text-green-600">Zolpai<span class="text-orange-500">.com</span></h1>
    <input id="searchBox" placeholder="খুঁজুন..." class="border rounded-full px-4 py-2 text-sm w-44 md:w-80">
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6">
  <div id="loading" class="text-center py-20">লোড হচ্ছে...</div>
  <div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
</main>

<script>
let allProducts=[];
async function load(){
  try{
    const res = await fetch('api.php'); // নিজের সার্ভার থেকে লোড হবে, CORS হবে না
    const json = await res.json();
    allProducts = json.data || [];
    document.getElementById('loading').style.display='none';
    render(allProducts);
  }catch(e){
    document.getElementById('loading').innerHTML = 'Error: '+e.message;
  }
}
function render(list){
  document.getElementById('grid').innerHTML = list.map(p=>{
    const original = parseFloat(p.price||0);
    const percent = PROFIT_BY_ID[p.id] !== undefined ? PROFIT_BY_ID[p.id] : DEFAULT_PROFIT;
    const myPrice = Math.round(original * (1 + percent/100));
    return `<div class="bg-white rounded-2xl shadow border overflow-hidden">
      <img src="${p.thumbnail_image}" class="h-52 w-full object-cover">
      <div class="p-3">
        <p class="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full w-fit">${p.category_name} • +${percent}%</p>
        <h3 class="font-semibold text-sm mt-1 h-10 line-clamp-2">${p.name}</h3>
        <div class="flex justify-between items-center mt-3">
          <div><p class="font-bold text-lg text-green-600">৳${myPrice}</p><p class="text-xs line-through text-gray-400">৳${original}</p></div>
          <button class="bg-orange-500 text-white px-4 py-1 rounded-full text-xs">Buy</button>
        </div>
      </div>
    </div>`;
  }).join('');
}
document.getElementById('searchBox').addEventListener('input', e=>{
  const q=e.target.value.toLowerCase();
  render(allProducts.filter(p=>p.name.toLowerCase().includes(q)));
});
load();
</script>
</body>
</html>
