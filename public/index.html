<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zolpai | Coming Soon</title>
    
    <!-- Google Fonts (Poppins & Noto Sans Bengali) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Noto Sans Bengali', sans-serif;
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            color: #000;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        /* You can change the brand color later */
        .brand-color {
            color: #000; 
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #111;
        }
        p {
            font-size: 1.1rem;
            color: #555;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #000;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo Text -->
        <div class="logo">Zol<span class="brand-color">pai</span></div>
        
        <!-- Notice in Bengali -->
        <h1>ওয়েবসাইটের কাজ চলছে</h1>
        <p>আপনাদের সেরা শপিং অভিজ্ঞতা দিতে আমরা খুব শীঘ্রই আসছি নতুন রূপে। আমাদের সাথেই থাকুন!</p>
        
        <!-- Loading Animation -->
        <div class="loader"></div>
    </div>

</body>
</html>
