<script>
let gasData = [], allProducts = [], categoryList = [], cart = JSON.parse(localStorage.getItem('zolpai_cart')) || [];
let customFirebasePrices = {}; 
let pendingAction = null, pendingProduct = null, availableVariantKeys = [];
let currentCheckoutType = 'cart', directOrderProduct = null;

const formatPrice = (price) => new Intl.NumberFormat('en-IN').format(price);

db.ref('custom_prices').on('value', (snapshot) => {
  customFirebasePrices = snapshot.val() || {};
  if(gasData.length > 0) processAndRenderData(); 
});

async function load(){
  updateCartUI(); 
  try{
    const res = await fetch(GOOGLE_SCRIPT_URL, { method: "GET", redirect: "follow" });
    if(!res.ok) throw new Error("সার্ভার রেসপন্স করছে না!");
    const json = await res.json();
    if(json.result === true) { gasData = json.data || []; processAndRenderData(); document.getElementById('loading').style.display = 'none'; }
  }catch(e){
    document.getElementById('loading').innerHTML = '<span class="text-red-500 font-bold bg-red-50 px-4 py-2 rounded-lg border border-red-200">Error: '+e.message+'</span>';
  }
}

function processAndRenderData() {
  allProducts = gasData.map(p => {
    let finalSalePrice = customFirebasePrices[p.id] ? parseFloat(customFirebasePrices[p.id]) : parseFloat(p.defaultSalePrice);
    p.myPrice = finalSalePrice; p.discountPercent = Math.round(((p.oldPrice - finalSalePrice) / p.oldPrice) * 100); return p;
  });
  extractCategories();
  const currentQ = document.getElementById('searchBox').value.toLowerCase();
  if(currentQ) renderProducts(allProducts.filter(p => p.name.toLowerCase().includes(currentQ) || p.category_name.toLowerCase().includes(currentQ)));
  else if (!document.getElementById('productView').classList.contains('hidden')) renderProducts(allProducts.filter(p => p.category_name === document.getElementById('currentCategoryTitle').innerText));
  else showCategories(); 
}

function extractCategories() {
  const catMap = new Map();
  allProducts.forEach(p => { if(!catMap.has(p.category_name)) catMap.set(p.category_name, p.thumbnail_image || 'https://via.placeholder.com/300'); });
  categoryList = Array.from(catMap, ([name, image]) => ({ name, image }));
}

function showCategories() {
  document.getElementById('productView').classList.add('hidden'); document.getElementById('categoryView').classList.remove('hidden'); document.getElementById('searchBox').value = '';
  document.getElementById('categoryGrid').innerHTML = categoryList.map(cat => `
    <div onclick="showCategoryProducts('${cat.name.replace(/'/g, "\\'")}')" class="bg-white rounded-2xl shadow-sm hover:shadow-lg transition-all cursor-pointer overflow-hidden border border-gray-100 flex flex-col items-center p-5 text-center group">
      <div class="w-24 h-24 mb-4 rounded-full overflow-hidden bg-green-50 border-[3px] border-green-100 group-hover:scale-110 transition-transform"><img src="${cat.image}" class="w-full h-full object-cover"></div>
      <h3 class="font-bold text-gray-800">${cat.name}</h3>
    </div>`).join('');
}

function showCategoryProducts(categoryName) {
  document.getElementById('categoryView').classList.add('hidden'); document.getElementById('productView').classList.remove('hidden'); document.getElementById('currentCategoryTitle').innerText = categoryName;
  renderProducts(allProducts.filter(p => p.category_name === categoryName));
}

function renderProducts(products) {
  const grid = document.getElementById('productGrid');
  if(products.length === 0) return grid.innerHTML = '<div class="col-span-full text-center py-10 font-bold bg-white rounded-xl border border-gray-100 shadow-sm text-gray-500">কোনো পণ্য পাওয়া যায়নি</div>';
  grid.innerHTML = products.map(p => `
    <div class="bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all border border-gray-100 flex flex-col cursor-pointer group" onclick="openQuickView(${p.id})">
      <div class="relative overflow-hidden bg-gray-50 aspect-square flex items-center justify-center">
        <img src="${p.thumbnail_image || 'https://via.placeholder.com/300'}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
        <span class="absolute top-2 left-2 text-[10px] bg-red-500 text-white px-2 py-0.5 rounded-full font-bold shadow-sm">-${p.discountPercent}%</span>
        <span class="absolute top-2 right-2 text-[10px] bg-gray-800/80 backdrop-blur-sm text-white px-2 py-0.5 rounded font-bold shadow-sm">কোড: ${p.id}</span>
      </div>
      <div class="p-3 md:p-4 flex flex-col flex-1">
        <h3 class="font-bold text-gray-700 text-xs md:text-sm h-9 md:h-10 line-clamp-2 leading-tight mb-2 group-hover:text-green-600 transition-colors">${p.name}</h3>
        <div class="flex items-center gap-2 mb-3 mt-auto">
          <p class="font-black text-base md:text-lg text-green-600 leading-none">৳${formatPrice(p.myPrice)}</p>
          <p class="text-[10px] md:text-xs line-through text-gray-400">৳${formatPrice(p.oldPrice)}</p>
        </div>
        <div class="flex flex-col gap-2 relative z-10" onclick="event.stopPropagation()">
          <button onclick="handleAction(${p.id}, 'cart')" class="w-full border-2 border-green-500 text-green-600 hover:bg-green-50 active:scale-95 py-1.5 rounded-xl text-xs font-bold transition-transform">🛒 কার্টে যোগ</button>
          <button onclick="handleAction(${p.id}, 'buy')" class="w-full bg-orange-500 hover:bg-orange-600 text-white active:scale-95 py-1.5 rounded-xl text-xs font-bold shadow-sm transition-transform">⚡ অর্ডার করুন</button>
        </div>
      </div>
    </div>`).join('');
}

document.getElementById('searchBox').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  if(!q) return showCategories();
  document.getElementById('categoryView').classList.add('hidden'); document.getElementById('productView').classList.remove('hidden'); document.getElementById('currentCategoryTitle').innerText = 'সার্চ রেজাল্ট';
  renderProducts(allProducts.filter(p => p.name.toLowerCase().includes(q) || p.category_name.toLowerCase().includes(q)));
});

function openQuickView(id) {
  const p = allProducts.find(item => item.id === id); if(!p) return;
  document.getElementById('qvTitle').innerText = p.name; document.getElementById('qvImage').src = p.thumbnail_image; document.getElementById('qvCode').innerText = `কোড: ${p.id}`;
  document.getElementById('qvPrice').innerText = `৳${formatPrice(p.myPrice)}`; document.getElementById('qvOldPrice').innerText = `৳${formatPrice(p.oldPrice)}`;
  document.getElementById('qvDiscountBadge').innerText = `সেভ ৳${formatPrice(p.oldPrice - p.myPrice)}`; document.getElementById('qvDesc').innerHTML = p.description || '<p>কোনো বিবরণ নেই।</p>';
  document.getElementById('qvActions').innerHTML = `<button onclick="handleAction(${p.id}, 'cart'); closeQuickView();" class="flex-1 border-2 border-green-500 text-green-600 bg-green-50 hover:bg-green-100 font-bold py-2.5 rounded-xl text-sm transition-colors">🛒 কার্টে যোগ</button><button onclick="handleAction(${p.id}, 'buy'); closeQuickView();" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 rounded-xl shadow-md text-sm transition-colors">⚡ অর্ডার</button>`;
  const gallery = document.getElementById('qvGallery');
  if(p.gallery_image && p.gallery_image.length > 0) {
    let images = [p.thumbnail_image, ...p.gallery_image];
    gallery.innerHTML = images.map(img => `<img src="${img}" onclick="document.getElementById('qvImage').src='${img}'" class="w-14 h-14 object-cover rounded-lg border-2 border-transparent hover:border-green-500 cursor-pointer transition-all shrink-0 shadow-sm bg-white">`).join('');
    gallery.classList.remove('hidden');
  } else gallery.classList.add('hidden');
  const modal = document.getElementById('quickViewModal'); const content = document.getElementById('quickViewContent');
  modal.classList.remove('hidden'); modal.classList.add('flex'); setTimeout(() => content.classList.replace('scale-95', 'scale-100'), 10);
}
function closeQuickView() { const content = document.getElementById('quickViewContent'); content.classList.replace('scale-100', 'scale-95'); setTimeout(() => { document.getElementById('quickViewModal').classList.add('hidden'); document.getElementById('quickViewModal').classList.remove('flex'); }, 300); }

function handleAction(id, actionType) {
  const p = allProducts.find(item => item.id === id); if(!p) return;
  if(p.product_type === 'variant' && p.variants && p.variants.length > 0) openVariantModal(p, actionType);
  else { if(actionType === 'cart') finalizeAddToCart(p, ''); else triggerCheckoutDirect(p, ''); }
}

function openVariantModal(product, actionType) {
  pendingProduct = product; pendingAction = actionType; const optionsMap = {};
  product.variants.forEach(v => { for(const key in v) { if(!['qty', 'regular_price', 'price', 'sku'].includes(key)) { if(!optionsMap[key]) optionsMap[key] = new Set(); if(v[key]) optionsMap[key].add(v[key]); } } });
  
  availableVariantKeys = Object.keys(optionsMap); const container = document.getElementById('variantOptionsContainer'); container.innerHTML = '';
  
  availableVariantKeys.forEach(key => {
    const safeKey = key.replace(/[^a-zA-Z0-9]/g, '_'); // Fix for keys with spaces
    if(Array.from(optionsMap[key]).length > 0) {
      let html = `<div class="mb-5"><h4 class="font-bold text-gray-700 mb-2">${key}:</h4><div class="flex flex-wrap gap-2">`;
      Array.from(optionsMap[key]).forEach((val, index) => {
        const inputId = `var_${safeKey}_${index}`;
        html += `<div><input type="radio" name="variant_${safeKey}" id="${inputId}" value="${val}" class="radio-btn-input hidden" ${index===0?'checked':''}><label for="${inputId}" class="radio-btn-label cursor-pointer px-4 py-1.5 border border-gray-300 bg-white rounded-lg text-sm font-bold shadow-sm transition-all">${val}</label></div>`;
      });
      container.insertAdjacentHTML('beforeend', html + `</div></div>`);
    }
  });
  
  const modal = document.getElementById('variantModal'); const content = document.getElementById('variantContent');
  modal.classList.remove('hidden'); modal.classList.add('flex'); setTimeout(() => content.classList.remove('translate-y-full'), 10);
  
  document.getElementById('confirmVariantBtn').onclick = () => {
    let selectedDetails = []; let isAllSelected = true;
    availableVariantKeys.forEach(key => { 
      const safeKey = key.replace(/[^a-zA-Z0-9]/g, '_');
      const selected = document.querySelector(`input[name="variant_${safeKey}"]:checked`); 
      if(selected) selectedDetails.push(`${key}: ${selected.value}`); else isAllSelected = false; 
    });
    if(!isAllSelected && availableVariantKeys.length > 0) return showToast("সব অপশন সিলেক্ট করুন", "error");
    closeVariantModal();
    const vString = selectedDetails.length > 0 ? `(${selectedDetails.join(', ')})` : '';
    if(pendingAction === 'cart') finalizeAddToCart(pendingProduct, vString); else triggerCheckoutDirect(pendingProduct, vString);
  };
}
function closeVariantModal() { const content = document.getElementById('variantContent'); content.classList.add('translate-y-full'); setTimeout(() => { document.getElementById('variantModal').classList.add('hidden'); document.getElementById('variantModal').classList.remove('flex'); }, 300); }

function saveCart() { localStorage.setItem('zolpai_cart', JSON.stringify(cart)); updateCartUI(); }
function finalizeAddToCart(p, variantString) {
  const cartItemId = p.id + (variantString ? '-' + variantString : ''); const existing = cart.find(item => item.cartId === cartItemId);
  if(existing) existing.qty++; else cart.push({ cartId: cartItemId, id: p.id, name: p.name, variantText: variantString, price: p.myPrice, image: p.thumbnail_image, qty: 1 });
  saveCart(); showToast("কার্টে যোগ করা হয়েছে! 🛒", "success");
}

function updateCartQty(cartId, change) {
  const item = cart.find(i => i.cartId === cartId);
  if(item) { item.qty += change; if(item.qty <= 0) removeFromCart(cartId); else saveCart(); }
}

function removeFromCart(cartId) {
  cart = cart.filter(i => i.cartId !== cartId);
  saveCart(); showToast("কার্ট থেকে মুছে ফেলা হয়েছে", "success");
}

function updateCartUI() {
  const count = cart.reduce((sum, item) => sum + item.qty, 0); document.querySelectorAll('.cart-count').forEach(el => el.innerText = count);
  const container = document.getElementById('cartItems');
  if(cart.length === 0) { container.innerHTML = `<div class="text-center text-gray-400 mt-10 font-bold">আপনার কার্ট খালি!</div>`; document.getElementById('cartTotal').innerText = '৳0'; return; }
  let total = 0;
  container.innerHTML = cart.map(item => {
    total += item.price * item.qty;
    return `
    <div class="flex gap-3 bg-white p-3 rounded-xl border shadow-sm relative pr-10">
      <img src="${item.image}" class="w-16 h-16 object-cover rounded-lg border border-gray-100">
      <div class="flex-1 flex flex-col justify-between">
        <div>
          <h4 class="text-sm font-bold text-gray-800 line-clamp-1">${item.name}</h4>
          ${item.variantText ? `<p class="text-[10px] font-bold text-orange-500">${item.variantText}</p>` : ''}
        </div>
        <div class="flex justify-between items-center mt-2">
          <span class="text-sm font-black text-green-600">৳${formatPrice(item.price)}</span>
          <div class="flex items-center border border-gray-200 rounded-lg shadow-sm bg-gray-50">
            <button onclick="updateCartQty('${item.cartId}', -1)" class="px-3 py-1 font-bold text-gray-600 hover:text-green-600">-</button>
            <span class="px-2 text-xs font-black w-6 text-center">${item.qty}</span>
            <button onclick="updateCartQty('${item.cartId}', 1)" class="px-3 py-1 font-bold text-gray-600 hover:text-green-600">+</button>
          </div>
        </div>
      </div>
      <!-- ★ Delete Button (Trash Icon) ★ -->
      <button onclick="removeFromCart('${item.cartId}')" class="absolute top-3 right-3 text-red-400 hover:text-red-600 bg-red-50 hover:bg-red-100 p-1.5 rounded-lg transition-colors shadow-sm" title="ডিলিট করুন">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
      </button>
    </div>`;
  }).join('');
  document.getElementById('cartTotal').innerText = `৳${formatPrice(total)}`;
}

function toggleCart() {
  const modal = document.getElementById('cartModal'); const content = document.getElementById('cartContent');
  if(modal.classList.contains('hidden')) { modal.classList.remove('hidden'); modal.classList.add('flex'); setTimeout(() => content.classList.remove('translate-x-full'), 10); } 
  else { content.classList.add('translate-x-full'); setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300); }
}

function showToast(message, type = 'success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `${type === 'success' ? 'bg-gray-800' : 'bg-red-500'} text-white px-6 py-3 rounded-full font-bold shadow-2xl transition-all duration-300 translate-y-10 opacity-0 flex items-center gap-2 text-sm z-[100] border border-gray-600/50`; 
  toast.innerHTML = message;
  container.appendChild(toast); setTimeout(() => { toast.classList.remove('translate-y-10', 'opacity-0'); }, 10);
  setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 2500);
}

function triggerCheckoutDirect(p, variantString) {
  currentCheckoutType = 'single'; directOrderProduct = { ...p, variantText: variantString, qty: 1 };
  document.getElementById('checkoutModal').classList.remove('hidden'); document.getElementById('checkoutModal').classList.add('flex');
}

function openCheckout(type) {
  if(type === 'cart' && cart.length === 0) return showToast('আপনার কার্ট খালি!', 'error');
  currentCheckoutType = 'cart'; toggleCart(); document.getElementById('checkoutModal').classList.remove('hidden'); document.getElementById('checkoutModal').classList.add('flex');
}

function closeCheckout() { document.getElementById('checkoutModal').classList.add('hidden'); document.getElementById('checkoutModal').classList.remove('flex'); }

async function submitOrderToDB() {
  const name = document.getElementById('custName').value.trim(); const phone = document.getElementById('custPhone').value.trim(); const address = document.getElementById('custAddress').value.trim();
  if(!name || !phone || !address) return showToast('দয়া করে সব তথ্য সঠিকভাবে পূরণ করুন!', 'error');
  
  const btn = document.getElementById('btnConfirmSite'); btn.innerHTML = "অপেক্ষা করুন..."; btn.disabled = true;
  let items = [], total = 0, itemsTextTG = "";
  
  if(currentCheckoutType === 'cart') {
    items = cart;
    cart.forEach((item, i) => { total += item.price * item.qty; itemsTextTG += `${i+1}. ${item.name} ${item.variantText||''} (কোড: ${item.id}) - ${item.qty}টি x ৳${item.price}\n`; });
  } else {
    items = [directOrderProduct]; total = directOrderProduct.myPrice;
    itemsTextTG = `1. ${directOrderProduct.name} ${directOrderProduct.variantText||''} (কোড: ${directOrderProduct.id}) - 1টি x ৳${directOrderProduct.myPrice}\n`;
  }

  const orderData = { customerName: name, customerPhone: phone, customerAddress: address, items: items, totalAmount: total, status: "Pending", timestamp: firebase.database.ServerValue.TIMESTAMP };

  try {
    const newOrderRef = db.ref('orders').push(); await newOrderRef.set(orderData);
    const tgMsg = `🛍 *নতুন অর্ডার!*\n\n👤 *নাম:* ${name}\n📞 *ফোন:* ${phone}\n📍 *ঠিকানা:* ${address}\n\n📦 *প্রোডাক্টসমূহ:* \n${itemsTextTG}\n💰 *সর্বমোট বিল:* ৳${formatPrice(total)}`;
    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: tgMsg, parse_mode: "Markdown" }) });
    closeCheckout(); showToast("🎉 আপনার অর্ডারটি সফলভাবে সম্পন্ন হয়েছে!", "success");
    document.getElementById('custName').value = ''; document.getElementById('custPhone').value = ''; document.getElementById('custAddress').value = '';
    if(currentCheckoutType === 'cart') { cart = []; saveCart(); }
  } catch(e) { showToast("সমস্যা হয়েছে! আবার চেষ্টা করুন।", "error"); } finally { btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg> ওয়েবসাইটেই অর্ডার করুন`; btn.disabled = false; }
}

// ★ WhatsApp Order with Image Link
function submitOrderToWhatsApp() {
  const name = document.getElementById('custName').value.trim(); const phone = document.getElementById('custPhone').value.trim(); const address = document.getElementById('custAddress').value.trim();
  let userDetails = ""; if(name && phone && address) userDetails = `\n👤 নাম: ${name}\n📞 ফোন: ${phone}\n📍 ঠিকানা: ${address}\n\n`;
  let msg = `হ্যালো, আমি নিচের পণ্যগুলো অর্ডার করতে চাই:\n${userDetails}`; let total = 0;
  
  if(currentCheckoutType === 'cart') {
    cart.forEach((item, i) => {
      msg += `${i+1}. ${item.name} (কোড: ${item.id}) ${item.variantText||''}\nপরিমাণ: ${item.qty} টি\nদাম: ৳${formatPrice(item.price * item.qty)}\nছবির লিংক: ${item.image}\n\n`;
      total += item.price * item.qty;
    });
  } else {
    msg += `1. ${directOrderProduct.name} (কোড: ${directOrderProduct.id}) ${directOrderProduct.variantText||''}\nপরিমাণ: 1 টি\nদাম: ৳${formatPrice(directOrderProduct.myPrice)}\nছবির লিংক: ${directOrderProduct.thumbnail_image}\n\n`;
    total = directOrderProduct.myPrice;
  }
  msg += `------------------\n*সর্বমোট বিল: ৳${formatPrice(total)}*`;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank'); closeCheckout();
}

load();
</script>
