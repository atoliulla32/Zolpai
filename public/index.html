      <button id="btnConfirmSite" onclick="submitOrderToDB()" class="w-full bg-gradient-to-b from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-bold py-4 rounded-xl shadow-[0_4px_12px_rgba(22,163,74,0.3)] transition-all text-lg flex justify-center items-center gap-2 btn-3d border border-green-500"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" /></svg> ওয়েবসাইটেই অর্ডার করুন</button>
      <div class="relative flex py-2 items-center"><div class="flex-grow border-t border-gray-200"></div><span class="flex-shrink-0 mx-4 text-gray-400 text-xs font-bold uppercase tracking-wider">অথবা</span><div class="flex-grow border-t border-gray-200"></div></div>
      <button onclick="submitOrderToWhatsApp()" class="w-full bg-white border-2 border-green-500 text-green-600 hover:bg-green-50 font-bold py-3.5 rounded-xl transition-all flex justify-center items-center gap-2 btn-3d shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        WhatsApp-এ অর্ডার দিন
      </button>
    </div>
  </div>
</div>

<div id="toastContainer" class="fixed bottom-24 md:bottom-10 left-1/2 transform -translate-x-1/2 z-[100] flex flex-col gap-3 pointer-events-none"></div>

<script>
let gasData = [], allProducts = [], categoryList = [], cart = JSON.parse(localStorage.getItem('zolpai_cart')) || [];
let customFirebasePrices = {}; 
let pendingAction = null, pendingProduct = null, availableVariantKeys = [];
let currentCheckoutType = 'cart', directOrderProduct = null;

let currentFilteredProducts = [];
let currentDisplayIndex = 0;
const ITEMS_PER_PAGE = 20;

const formatPrice = (price) => new Intl.NumberFormat('en-IN').format(price);
function toggleBodyScroll(lock) { document.body.style.overflow = lock ? 'hidden' : ''; }

db.ref('custom_prices').on('value', (snapshot) => {
  customFirebasePrices = snapshot.val() || {};
  if(gasData.length > 0) processAndRenderData(); 
});

async function load(){
  updateCartUI(); 
  try{
    const res = await fetch(GOOGLE_SCRIPT_URL, { method: "GET", redirect: "follow" });
    if(!res.ok) throw new Error("সার্ভার রেসপন্স করছে না!");
    const json = await res.json();
    if(json.result === true) { 
      gasData = json.data || []; 
      processAndRenderData(); 
      document.getElementById('loading').style.display = 'none'; 
      
      // ★ Check URL for specific product ID on Load ★
      setTimeout(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const pid = urlParams.get('product_id');
        if(pid) openQuickView(parseInt(pid));
      }, 500);
    }
  }catch(e){
    document.getElementById('loading').innerHTML = '<span class="text-red-500 font-bold bg-red-50 px-5 py-3 rounded-xl border border-red-100 shadow-sm">Error: '+e.message+'</span>';
  }
}

function processAndRenderData() {
  allProducts = gasData.map(p => {
    let finalSalePrice = customFirebasePrices[p.id] ? parseFloat(customFirebasePrices[p.id]) : parseFloat(p.defaultSalePrice);
    p.myPrice = finalSalePrice; p.discountPercent = Math.round(((p.oldPrice - finalSalePrice) / p.oldPrice) * 100); return p;
  });
  extractCategories();
  
  const searchInputs = [document.getElementById('searchBox'), document.getElementById('searchBoxMobile')];
  const currentQ = searchInputs.find(input => input.value)?.value.toLowerCase();
  
  if(currentQ) initProductView(allProducts.filter(p => p.name.toLowerCase().includes(currentQ) || p.category_name.toLowerCase().includes(currentQ)));
  else if (!document.getElementById('productView').classList.contains('hidden')) initProductView(allProducts.filter(p => p.category_name === document.getElementById('currentCategoryTitle').innerText));
  else showCategories(); 
}

function extractCategories() {
  const catMap = new Map();
  allProducts.forEach(p => { if(!catMap.has(p.category_name)) catMap.set(p.category_name, p.thumbnail_image || 'https://via.placeholder.com/300'); });
  categoryList = Array.from(catMap, ([name, image]) => ({ name, image }));
}

function showCategories() {
  document.getElementById('productView').classList.add('hidden'); document.getElementById('categoryView').classList.remove('hidden'); 
  document.getElementById('searchBox').value = ''; document.getElementById('searchBoxMobile').value = '';
  document.getElementById('categoryGrid').innerHTML = categoryList.map((cat, i) => `
    <div onclick="showCategoryProducts('${cat.name.replace(/'/g, "\\'")}')" class="bg-white rounded-3xl shadow-[0_5px_15px_rgba(0,0,0,0.04)] hover:shadow-[0_15px_30px_rgba(0,0,0,0.08)] transform hover:-translate-y-1 transition-all duration-300 cursor-pointer border border-gray-100 flex flex-col items-center p-6 text-center group animate-fade-up" style="animation-delay: ${i*0.05}s">
      <div class="w-24 h-24 mb-5 rounded-full overflow-hidden bg-green-50 border-[3px] border-green-100 group-hover:scale-110 group-hover:border-green-400 transition-all duration-500 shadow-inner"><img src="${cat.image}" class="w-full h-full object-cover"></div>
      <h3 class="font-bold text-gray-800 text-sm md:text-base group-hover:text-green-600 transition-colors">${cat.name}</h3>
    </div>`).join('');
}

function showCategoryProducts(categoryName) {
  document.getElementById('categoryView').classList.add('hidden'); document.getElementById('productView').classList.remove('hidden'); document.getElementById('currentCategoryTitle').innerText = categoryName;
  initProductView(allProducts.filter(p => p.category_name === categoryName));
}

const handleSearch = (e) => {
  const q = e.target.value.toLowerCase();
  document.getElementById(e.target.id === 'searchBox' ? 'searchBoxMobile' : 'searchBox').value = q;
  if(!q) return showCategories();
  document.getElementById('categoryView').classList.add('hidden'); document.getElementById('productView').classList.remove('hidden'); document.getElementById('currentCategoryTitle').innerText = 'সার্চ রেজাল্ট';
  initProductView(allProducts.filter(p => p.name.toLowerCase().includes(q) || p.category_name.toLowerCase().includes(q)));
};
document.getElementById('searchBox').addEventListener('input', handleSearch);
document.getElementById('searchBoxMobile').addEventListener('input', handleSearch);

function initProductView(products) {
  currentFilteredProducts = products;
  currentDisplayIndex = 0;
  document.getElementById('productGrid').innerHTML = '';
  
  if(products.length === 0) {
    document.getElementById('loadMoreContainer').classList.add('hidden');
    document.getElementById('productGrid').innerHTML = '<div class="col-span-full text-center py-16 font-bold bg-white rounded-3xl border border-gray-100 shadow-sm text-gray-500">কোনো পণ্য পাওয়া যায়নি</div>';
    return;
  }
  loadMoreProducts();
}

function renderProductCards(productsBatch) {
  return productsBatch.map((p, i) => `
    <div class="bg-white rounded-3xl shadow-[0_5px_15px_rgba(0,0,0,0.04)] hover:shadow-[0_15px_35px_rgba(0,0,0,0.1)] transform hover:-translate-y-1 transition-all duration-300 border border-gray-100 flex flex-col cursor-pointer group overflow-hidden animate-fade-up relative" style="animation-delay: ${(i%10)*0.05}s" onclick="openQuickView(${p.id})">
      <div class="relative overflow-hidden bg-gray-50 aspect-square flex items-center justify-center">
        <img src="${p.thumbnail_image || 'https://via.placeholder.com/300'}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
        <span class="absolute top-3 left-3 text-[10px] bg-red-500 text-white border border-red-400 px-2.5 py-1 rounded-full font-bold shadow-md z-10">-${p.discountPercent}%</span>
        <span class="absolute top-3 right-3 text-[10px] bg-black/60 backdrop-blur-sm text-white px-2.5 py-1 rounded-full font-bold shadow-sm z-10">কোড: ${p.id}</span>
        
        <div class="absolute bottom-3 left-1/2 transform -translate-x-1/2 bg-white/95 backdrop-blur shadow-md border border-gray-200 text-gray-700 px-3 py-1.5 rounded-full text-[10px] font-bold flex items-center gap-1.5 opacity-100 md:opacity-0 md:group-hover:opacity-100 md:group-hover:-translate-y-1 transition-all duration-300 z-20 whitespace-nowrap btn-3d">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
          বিস্তারিত দেখুন
        </div>
      </div>
      <div class="p-4 md:p-5 flex flex-col flex-1 relative z-10 bg-white">
        <h3 class="font-bold text-gray-700 text-xs md:text-sm h-9 md:h-10 line-clamp-2 leading-tight mb-3 group-hover:text-green-600 transition-colors">${p.name}</h3>
        <div class="flex items-center gap-2 mb-4 mt-auto">
          <p class="font-black text-lg md:text-xl text-green-600 leading-none tracking-tight">৳${formatPrice(p.myPrice)}</p>
          <p class="text-[10px] md:text-xs line-through text-gray-400 font-bold">৳${formatPrice(p.oldPrice)}</p>
        </div>
        <div class="flex flex-col gap-2 relative z-30" onclick="event.stopPropagation()">
          <button onclick="handleAction(${p.id}, 'cart')" class="w-full border-2 border-green-500 text-green-600 hover:bg-green-50 py-2 rounded-xl text-xs font-bold transition-all shadow-sm hover:shadow btn-3d">🛒 কার্টে যোগ</button>
          <button onclick="handleAction(${p.id}, 'buy')" class="w-full bg-gradient-to-b from-orange-400 to-orange-500 hover:from-orange-500 hover:to-orange-600 text-white py-2.5 rounded-xl text-xs font-bold shadow-[0_3px_8px_rgba(249,115,22,0.3)] transition-all border border-orange-500 btn-3d">⚡ অর্ডার করুন</button>
        </div>
      </div>
    </div>`).join('');
}

function loadMoreProducts() {
  const btn = document.getElementById('loadMoreBtn');
  if(btn) btn.innerHTML = '<svg class="animate-spin h-5 w-5 text-green-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> লোড হচ্ছে...';
  
  setTimeout(() => {
    const nextBatch = currentFilteredProducts.slice(currentDisplayIndex, currentDisplayIndex + ITEMS_PER_PAGE);
    document.getElementById('productGrid').insertAdjacentHTML('beforeend', renderProductCards(nextBatch));
    currentDisplayIndex += ITEMS_PER_PAGE;
    
    const container = document.getElementById('loadMoreContainer');
    if(currentDisplayIndex < currentFilteredProducts.length) {
      container.classList.remove('hidden');
      if(btn) btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" /></svg> আরও দেখুন';
    } else {
      container.classList.add('hidden');
    }
  }, 200);
}

// ★ Open Quick View & Update URL ★
function openQuickView(id) {
  const p = allProducts.find(item => item.id == id); if(!p) return;
  
  // Set Product ID in URL without reloading
  const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?product_id=' + p.id;
  window.history.pushState({path:newUrl}, '', newUrl);

  document.getElementById('qvTitle').innerText = p.name; 
  document.getElementById('qvImage').src = p.thumbnail_image; 
  document.getElementById('qvCode').innerText = `কোড: ${p.id}`;
  document.getElementById('qvPrice').innerText = `৳${formatPrice(p.myPrice)}`; 
  document.getElementById('qvOldPrice').innerText = `৳${formatPrice(p.oldPrice)}`;
  document.getElementById('qvDiscountBadge').innerText = `সেভ ৳${formatPrice(p.oldPrice - p.myPrice)}`; 
  document.getElementById('qvDesc').innerHTML = p.description || '<p>কোনো বিবরণ নেই।</p>';
  document.getElementById('qvActions').innerHTML = `<button onclick="handleAction(${p.id}, 'cart'); closeQuickView();" class="flex-1 border-2 border-green-500 text-green-600 bg-green-50 hover:bg-green-100 font-bold py-3.5 rounded-2xl text-sm transition-all shadow-sm btn-3d">🛒 কার্টে যোগ</button><button onclick="handleAction(${p.id}, 'buy'); closeQuickView();" class="flex-1 bg-gradient-to-b from-orange-400 to-orange-500 hover:from-orange-500 hover:to-orange-600 text-white font-bold py-3.5 rounded-2xl shadow-[0_4px_12px_rgba(249,115,22,0.3)] text-sm transition-all border border-orange-500 btn-3d">⚡ দ্রুত অর্ডার</button>`;
  
  const gallery = document.getElementById('qvGallery');
  if(p.gallery_image && p.gallery_image.length > 0) {
    let images = [p.thumbnail_image, ...p.gallery_image];
    gallery.innerHTML = images.map(img => `<img src="${img}" onclick="document.getElementById('qvImage').src='${img}'" class="w-16 h-16 object-cover rounded-xl border-2 border-transparent hover:border-green-400 cursor-pointer transition-all shrink-0 shadow-sm bg-gray-50">`).join('');
    gallery.classList.remove('hidden');
  } else gallery.classList.add('hidden');
  
  toggleBodyScroll(true); 
  const modal = document.getElementById('quickViewModal'); const content = document.getElementById('quickViewContent');
  modal.classList.remove('hidden'); modal.classList.add('flex'); setTimeout(() => { modal.classList.add('opacity-100'); content.classList.replace('scale-95', 'scale-100'); }, 10);
}

// ★ Close Quick View & Revert URL ★
function closeQuickView() { 
  const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
  window.history.pushState({path:cleanUrl}, '', cleanUrl);

  const modal = document.getElementById('quickViewModal'); const content = document.getElementById('quickViewContent');
  modal.classList.remove('opacity-100'); content.classList.replace('scale-100', 'scale-95'); 
  setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); toggleBodyScroll(false); }, 300); 
}

// ★ Copy & Native Share Functions ★
function copyProductLink() {
  const url = window.location.href;
  if(navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(url).then(() => showToast('লিংক কপি করা হয়েছে!', 'success'));
  } else {
    // Fallback for older browsers
    const textArea = document.createElement("textarea");
    textArea.value = url;
    document.body.appendChild(textArea);
    textArea.select();
    try { document.execCommand('copy'); showToast('লিংক কপি করা হয়েছে!', 'success'); } 
    catch (err) { alert("কপি করা যায়নি, ম্যানুয়ালি কপি করুন।\n" + url); }
    document.body.removeChild(textArea);
  }
}

async function shareProduct() {
  const url = window.location.href;
  const title = document.getElementById('qvTitle').innerText;
  
  // Check if Web Share API is supported (Native Android/iOS Share)
  if (navigator.share) {
    try {
      await navigator.share({
        title: title,
        text: 'Zolpai.com এ এই প্রোডাক্টটি দেখুন! 🔥',
        url: url
      });
    } catch (err) {
      console.log('Share canceled or failed', err);
    }
  } else {
    // If share is not supported, fallback to copy
    copyProductLink();
  }
}

function handleAction(id, actionType) {
  const p = allProducts.find(item => item.id == id); if(!p) return;
  if(p.product_type === 'variant' && p.variants && p.variants.length > 0) openVariantModal(p, actionType);
  else { if(actionType === 'cart') finalizeAddToCart(p, ''); else triggerCheckoutDirect(p, ''); }
}

function openVariantModal(product, actionType) {
  pendingProduct = product; pendingAction = actionType; const optionsMap = {};
  product.variants.forEach(v => { for(const key in v) { if(!['qty', 'regular_price', 'price', 'sku'].includes(key)) { if(!optionsMap[key]) optionsMap[key] = new Set(); if(v[key]) optionsMap[key].add(v[key]); } } });
  availableVariantKeys = Object.keys(optionsMap); const container = document.getElementById('variantOptionsContainer'); container.innerHTML = '';
  availableVariantKeys.forEach(key => {
    const safeKey = key.replace(/[^a-zA-Z0-9]/g, '_'); 
    if(Array.from(optionsMap[key]).length > 0) {
      let html = `<div class="mb-6"><h4 class="font-bold text-gray-800 mb-3">${key}:</h4><div class="flex flex-wrap gap-2.5">`;
      Array.from(optionsMap[key]).forEach((val, index) => {
        const inputId = `var_${safeKey}_${index}`;
        html += `<div><input type="radio" name="variant_${safeKey}" id="${inputId}" value="${val}" class="radio-btn-input hidden" ${index===0?'checked':''}><label for="${inputId}" class="radio-btn-label cursor-pointer px-5 py-2 border border-gray-300 bg-white rounded-xl text-sm font-bold shadow-sm transition-all inline-block hover:border-green-500">${val}</label></div>`;
      });
      container.insertAdjacentHTML('beforeend', html + `</div></div>`);
    }
  });
  
  toggleBodyScroll(true);
  const modal = document.getElementById('variantModal'); const content = document.getElementById('variantContent');
  modal.classList.remove('hidden'); modal.classList.add('flex'); setTimeout(() => { modal.classList.add('opacity-100'); content.classList.replace('translate-y-full', 'translate-y-0'); content.classList.replace('md:translate-y-10', 'md:translate-y-0'); }, 10);
  
  document.getElementById('confirmVariantBtn').onclick = () => {
    let selectedDetails = []; let isAllSelected = true;
    availableVariantKeys.forEach(key => { 
      const safeKey = key.replace(/[^a-zA-Z0-9]/g, '_');
      const selected = document.querySelector(`input[name="variant_${safeKey}"]:checked`); 
      if(selected) selectedDetails.push(`${key}: ${selected.value}`); else isAllSelected = false; 
    });
    if(!isAllSelected && availableVariantKeys.length > 0) return showToast("সব অপশন সিলেক্ট করুন", "error");
    closeVariantModal();
    const vString = selectedDetails.length > 0 ? `(${selectedDetails.join(', ')})` : '';
    if(pendingAction === 'cart') finalizeAddToCart(pendingProduct, vString); else triggerCheckoutDirect(pendingProduct, vString);
  };
}
function closeVariantModal() { 
  const modal = document.getElementById('variantModal'); const content = document.getElementById('variantContent');
  modal.classList.remove('opacity-100'); content.classList.replace('translate-y-0', 'translate-y-full'); content.classList.replace('md:translate-y-0', 'md:translate-y-10');
  setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); toggleBodyScroll(false); }, 300); 
}

function saveCart() { localStorage.setItem('zolpai_cart', JSON.stringify(cart)); updateCartUI(); }
function finalizeAddToCart(p, variantString) {
  const cartItemId = p.id + (variantString ? '-' + variantString : ''); const existing = cart.find(item => item.cartId === cartItemId);
  if(existing) existing.qty++; else cart.push({ cartId: cartItemId, id: p.id, name: p.name, variantText: variantString, price: p.myPrice, image: p.thumbnail_image, qty: 1 });
  saveCart(); showToast("কার্টে যোগ করা হয়েছে! 🛒", "success");
}

function updateCartQty(cartId, change) {
  const item = cart.find(i => i.cartId === cartId);
  if(item) { item.qty += change; if(item.qty <= 0) removeFromCart(cartId); else saveCart(); }
}

function removeFromCart(cartId) {
  cart = cart.filter(i => i.cartId !== cartId);
  saveCart(); showToast("কার্ট থেকে মুছে ফেলা হয়েছে", "success");
}

function updateCartUI() {
  const count = cart.reduce((sum, item) => sum + item.qty, 0); document.querySelectorAll('.cart-count').forEach(el => el.innerText = count);
  const container = document.getElementById('cartItems');
  if(cart.length === 0) { container.innerHTML = `<div class="flex flex-col items-center justify-center h-full text-gray-400 mt-10"><svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg><p class="font-bold text-lg">আপনার কার্ট খালি!</p></div>`; document.getElementById('cartTotal').innerText = '৳0'; return; }
  let total = 0;
  container.innerHTML = cart.map((item, i) => {
    total += item.price * item.qty;
    return `
    <div class="flex gap-4 bg-white p-4 rounded-2xl border border-gray-100 shadow-sm relative pr-10 hover:shadow-md transition-shadow animate-fade-up" style="animation-delay: ${i*0.05}s">
      <img src="${item.image}" class="w-20 h-20 object-cover rounded-xl border border-gray-100 bg-gray-50">
      <div class="flex-1 flex flex-col justify-center">
        <h4 class="text-sm font-bold text-gray-800 line-clamp-2 leading-tight">${item.name}</h4>
        ${item.variantText ? `<p class="text-xs font-bold text-orange-500 mt-1">${item.variantText}</p>` : ''}
        <div class="flex justify-between items-center mt-3">
          <span class="text-base font-black text-green-600 tracking-tight">৳${formatPrice(item.price)}</span>
          <div class="flex items-center border border-gray-200 rounded-lg shadow-sm bg-gray-50 overflow-hidden">
            <button onclick="updateCartQty('${item.cartId}', -1)" class="px-3.5 py-1.5 font-black text-gray-500 hover:text-white hover:bg-green-500 transition-colors">-</button>
            <span class="px-2 text-xs font-black w-6 text-center text-gray-800">${item.qty}</span>
            <button onclick="updateCartQty('${item.cartId}', 1)" class="px-3.5 py-1.5 font-black text-gray-500 hover:text-white hover:bg-green-500 transition-colors">+</button>
          </div>
        </div>
      </div>
      <button onclick="removeFromCart('${item.cartId}')" class="absolute top-4 right-3 text-red-300 hover:text-red-600 hover:bg-red-50 p-2 rounded-xl transition-all" title="ডিলিট করুন">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
      </button>
    </div>`;
  }).join('');
  document.getElementById('cartTotal').innerText = `৳${formatPrice(total)}`;
}

function toggleCart() {
  const modal = document.getElementById('cartModal'); const content = document.getElementById('cartContent');
  if(modal.classList.contains('hidden')) { 
    toggleBodyScroll(true);
    modal.classList.remove('hidden'); modal.classList.add('flex'); setTimeout(() => { modal.classList.add('opacity-100'); content.classList.remove('translate-x-full'); }, 10); 
  } else { 
    modal.classList.remove('opacity-100'); content.classList.add('translate-x-full'); setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); toggleBodyScroll(false); }, 300); 
  }
}

function showToast(message, type = 'success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  const icon = type === 'success' ? `<svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>` : `<svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
  toast.className = `bg-gray-900 text-white px-5 py-3.5 rounded-2xl font-bold shadow-[0_10px_25px_rgba(0,0,0,0.2)] transition-all duration-300 translate-y-10 opacity-0 flex items-center gap-3 text-sm z-[100] border border-gray-700`; 
  toast.innerHTML = `${icon} <span>${message}</span>`;
  container.appendChild(toast); setTimeout(() => { toast.classList.remove('translate-y-10', 'opacity-0'); }, 10);
  setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 2500);
}

function triggerCheckoutDirect(p, variantString) {
  currentCheckoutType = 'single'; directOrderProduct = { ...p, variantText: variantString, qty: 1 };
  toggleBodyScroll(true);
  const modal = document.getElementById('checkoutModal');
  modal.classList.remove('hidden'); modal.classList.add('flex'); setTimeout(() => { modal.classList.add('opacity-100'); }, 10);
}

function openCheckout(type) {
  if(type === 'cart' && cart.length === 0) return showToast('আপনার কার্ট খালি!', 'error');
  currentCheckoutType = 'cart'; 
  const cartContent = document.getElementById('cartContent');
  document.getElementById('cartModal').classList.remove('opacity-100'); cartContent.classList.add('translate-x-full');
  setTimeout(() => { 
    document.getElementById('cartModal').classList.add('hidden'); document.getElementById('cartModal').classList.remove('flex'); 
    const modal = document.getElementById('checkoutModal');
    modal.classList.remove('hidden'); modal.classList.add('flex'); setTimeout(() => { modal.classList.add('opacity-100'); }, 10);
  }, 300);
}

function closeCheckout() { 
  const modal = document.getElementById('checkoutModal');
  modal.classList.remove('opacity-100'); setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); toggleBodyScroll(false); }, 300); 
}

async function submitOrderToDB() {
  const name = document.getElementById('custName').value.trim(); const phone = document.getElementById('custPhone').value.trim(); const address = document.getElementById('custAddress').value.trim();
  if(!name || !phone || !address) return showToast('দয়া করে সব তথ্য সঠিকভাবে পূরণ করুন!', 'error');
  
  const btn = document.getElementById('btnConfirmSite'); btn.innerHTML = '<svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> অপেক্ষা করুন...'; btn.disabled = true;
  let items = [], total = 0, itemsTextTG = "";
  
  if(currentCheckoutType === 'cart') {
    items = cart;
    cart.forEach((item, i) => { total += item.price * item.qty; itemsTextTG += `${i+1}. ${item.name} ${item.variantText||''} (কোড: ${item.id}) - ${item.qty}টি x ৳${item.price}\n`; });
  } else {
    items = [directOrderProduct]; total = directOrderProduct.myPrice;
    itemsTextTG = `1. ${directOrderProduct.name} ${directOrderProduct.variantText||''} (কোড: ${directOrderProduct.id}) - 1টি x ৳${directOrderProduct.myPrice}\n`;
  }

  const orderData = { customerName: name, customerPhone: phone, customerAddress: address, items: items, totalAmount: total, status: "Pending", timestamp: firebase.database.ServerValue.TIMESTAMP };

  try {
    const newOrderRef = db.ref('orders').push(); await newOrderRef.set(orderData);
    const tgMsg = `🛍 *নতুন অর্ডার!*\n\n👤 *নাম:* ${name}\n📞 *ফোন:* ${phone}\n📍 *ঠিকানা:* ${address}\n\n📦 *প্রোডাক্টসমূহ:* \n${itemsTextTG}\n💰 *সর্বমোট বিল:* ৳${formatPrice(total)}`;
    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: tgMsg, parse_mode: "Markdown" }) });
    closeCheckout(); showToast("🎉 আপনার অর্ডারটি সফলভাবে সম্পন্ন হয়েছে!", "success");
    document.getElementById('custName').value = ''; document.getElementById('custPhone').value = ''; document.getElementById('custAddress').value = '';
    if(currentCheckoutType === 'cart') { cart = []; saveCart(); }
  } catch(e) { showToast("সমস্যা হয়েছে! আবার চেষ্টা করুন।", "error"); } finally { btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" /></svg> ওয়েবসাইটেই অর্ডার করুন`; btn.disabled = false; }
}

function submitOrderToWhatsApp() {
  const name = document.getElementById('custName').value.trim(); const phone = document.getElementById('custPhone').value.trim(); const address = document.getElementById('custAddress').value.trim();
  let userDetails = ""; if(name && phone && address) userDetails = `\n👤 নাম: ${name}\n📞 ফোন: ${phone}\n📍 ঠিকানা: ${address}\n\n`;
  let msg = `হ্যালো, আমি নিচের পণ্যগুলো অর্ডার করতে চাই:\n${userDetails}`; let total = 0;
  
  if(currentCheckoutType === 'cart') {
    cart.forEach((item, i) => {
      msg += `${i+1}. ${item.name} (কোড: ${item.id}) ${item.variantText||''}\nপরিমাণ: ${item.qty} টি\nদাম: ৳${formatPrice(item.price * item.qty)}\nছবির লিংক: ${item.image}\n\n`;
      total += item.price * item.qty;
    });
  } else {
    msg += `1. ${directOrderProduct.name} (কোড: ${directOrderProduct.id}) ${directOrderProduct.variantText||''}\nপরিমাণ: 1 টি\nদাম: ৳${formatPrice(directOrderProduct.myPrice)}\nছবির লিংক: ${directOrderProduct.thumbnail_image}\n\n`;
    total = directOrderProduct.myPrice;
  }
  msg += `------------------\n*সর্বমোট বিল: ৳${formatPrice(total)}*`;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank'); closeCheckout();
}

load();
