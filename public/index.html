<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zolpai.com - Home</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Hind Siliguri',sans-serif}</style>
</head>
<body class="bg-gray-50 text-gray-800">

<script>
const PROFIT_BY_ID = {};
const DEFAULT_PROFIT = 150; // সব প্রোডাক্টে 150% দাম বাড়বে

// আপনার API Key & Secret
const API_KEY = "dumkol_key_a3SsiDLJLIKaKdPV";
const API_SECRET = "dumkol_sec_BfCYnfv70oYQFRC6JqJM5CjhAB6uojHN";
</script>

<header class="bg-white shadow-sm sticky top-0 z-50 backdrop-blur-md bg-white/90">
  <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
    <h1 class="text-3xl font-black text-green-600 tracking-tight">Zolpai<span class="text-orange-500">.com</span></h1>
    <div class="relative">
      <input id="searchBox" placeholder="পণ্য খুঁজুন..." class="border border-gray-300 rounded-full pl-4 pr-10 py-2 text-sm w-48 md:w-64 focus:outline-none focus:ring-2 focus:ring-green-500 transition-all">
      <svg class="w-5 h-5 absolute right-3 top-2.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-8">
  <div id="loading" class="flex flex-col items-center justify-center py-20">
    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-green-600 mb-4"></div>
    <p class="text-gray-500 font-semibold">লোড হচ্ছে...</p>
  </div>
  <div id="grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6"></div>
</main>

<script>
let allProducts=[];

async function load(){
  try {
    // এখানে আপনার ডোমেইনের API লিংক আপডেট করা হয়েছে
    const res = await fetch('https://zolpai.com/api.php', { 
      method: 'GET',
      headers: {
        'Content-Type': 'application/json',
        'X-Api-Key': API_KEY,
        'X-Api-Secret': API_SECRET
      }
    });
    const json = await res.json();
    allProducts = json.data || [];
  } catch (error) {
    console.error("CORS বা Fetch Error:", error);
    // এরর হলে ডেমো দেখানোর জন্য একটি ডামি ডেটা (প্রোডাকশনে মুছে দিতে পারেন)
    allProducts = [{id: 1, name: 'ডেমো প্রোডাক্ট', price: '100', thumbnail_image: 'https://via.placeholder.com/300'}];
  }
  
  document.getElementById('loading').style.display='none';
  render(allProducts);
}

function render(list){
  if(list.length === 0) {
    document.getElementById('grid').innerHTML = '<div class="col-span-full text-center text-gray-500 py-10">কোনো পণ্য পাওয়া যায়নি</div>';
    return;
  }
  
  document.getElementById('grid').innerHTML = list.map(p=>{
    const original = parseFloat(p.price||0);
    const percent = PROFIT_BY_ID[p.id] !== undefined ? PROFIT_BY_ID[p.id] : DEFAULT_PROFIT;
    const myPrice = Math.round(original * (1 + percent/100));

    return `
    <div class="bg-white rounded-2xl shadow-sm hover:shadow-lg transition-shadow duration-300 border border-gray-100 overflow-hidden group">
      <div class="relative overflow-hidden">
        <img src="${p.thumbnail_image}" class="h-48 w-full object-cover group-hover:scale-105 transition-transform duration-500">
        <span class="absolute top-2 left-2 text-[10px] bg-red-500 text-white px-2 py-0.5 rounded-full font-bold shadow">+${percent}%</span>
      </div>
      <div class="p-4">
        <h3 class="font-semibold text-gray-800 text-sm mt-1 h-10 line-clamp-2 leading-tight">${p.name}</h3>
        <div class="flex justify-between items-end mt-4">
          <div>
            <p class="text-xs line-through text-gray-400 mb-0.5">৳${original}</p>
            <p class="font-bold text-lg text-green-600 leading-none">৳${myPrice}</p>
          </div>
          <button class="bg-orange-500 hover:bg-orange-600 active:scale-95 text-white px-4 py-2 rounded-full text-xs font-bold transition-all shadow-md">অর্ডার</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

document.getElementById('searchBox').addEventListener('input', e=>{
  const q=e.target.value.toLowerCase();
  render(allProducts.filter(p=>p.name.toLowerCase().includes(q)));
});

load();
</script>
</body>
</html>
